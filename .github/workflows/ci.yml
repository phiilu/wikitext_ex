name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly on main: a new fuzz batch, and the audits against new advisories.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; main's run to
# completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Caches are keyed on the OTP, Elixir and lock they were built with, and fall
# back to the newest cache of the same OTP and Elixir. A job sharing another's
# cache only restores it, so one job saves each key. The release workflow uses
# no cache, so nothing a pull request wrote can reach a published package.
jobs:
  check:
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: mise.toml
          version-type: strict
      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
        if: always()
      - run: mix format --check-formatted
        if: always()
      - run: mix credo --strict
        if: always()
      - run: mix hex.audit
        if: always()
      - run: mix deps.audit.check
        if: always()
      - run: mix deps.unlock --check-unused
        if: always()
      - run: mix test --warnings-as-errors
        if: always()
      - name: Build the Hex package
        run: mix hex.build
        if: always()

  # Regenerates the references with the mwparserfromhell the reference script
  # pins and fuzzes against it, so an update of the reference or of Python
  # merges only while WikitextEx still parses as the reference does.
  reference:
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
      # Elixir and OTP come from setup-beam; mise installs only the Python side.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's changes are diffed against its base.
          fetch-depth: 0
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: mise.toml
          version-type: strict
      - name: Set up Python and uv
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.8
          install_args: python uv
      - name: Restore deps and build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - run: mise run reference:suite
      - run: mise run reference:edge-cases
      - name: Check the references are unchanged
        run: git diff --exit-code test/fixtures
      # A pull request fuzzes only when what parses, the reference or this
      # workflow changed: with a fixed seed nothing else can change the result.
      - name: Check whether the parser or the reference changed
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ] ||
            git diff --name-only "origin/$BASE...HEAD" |
              grep -Eq '^(lib/|scripts/|test/fixtures/|mise\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          fi
      # The weekly run fuzzes a new, larger batch, its seed the run's ID in
      # this step's log; every other run repeats the fixed batch.
      - name: Fuzz against the reference
        if: steps.changes.outputs.fuzz == 'true'
        env:
          SEED: ${{ github.event_name == 'schedule' && github.run_id || 1 }}
          COUNT: ${{ github.event_name == 'schedule' && 20000 || 10000 }}
        run: mise run fuzz "$SEED" "$COUNT"

  # Dialyxir and ExDoc are :dev dependencies.
  dialyzer:
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: mise.toml
          version-type: strict
      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-dev-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      # The PLTs are saved as soon as they are built, so a failing analysis
      # does not rebuild them on the next run.
      - name: Restore PLTs
        id: plt-cache
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-
      - name: Build PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt
      - name: Save PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}
      - run: mix dialyzer --format github
      - run: mix docs --warnings-as-errors
        if: always()

  # Every Elixir minor release mix.exs accepts below the one mise.toml pins,
  # read from both so neither a new pin nor a new requirement leaves the matrix
  # behind: the newest patch of each, on the newest OTP hex builds it for.
  elixir-versions:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        # bash fails the step when curl does, rather than writing an empty matrix.
        shell: bash
        run: |
          minimum=$(sed -n 's/^ *elixir: "~> 1\.\([0-9]*\)".*/\1/p' mix.exs)
          pinned=$(sed -n 's/^elixir = "1\.\([0-9]*\)\..*/\1/p' mise.toml)
          matrix=$(curl -fsSL https://builds.hex.pm/builds/elixir/builds.txt |
            jq -R -s -c --argjson minimum "$minimum" --argjson pinned "$pinned" '
              [split("\n")[]
               | capture("^v1\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)-otp-(?<otp>[0-9]+) ")
               | map_values(tonumber)
               | select(.minor >= $minimum and .minor < $pinned)]
              | group_by(.minor)
              | map(max_by([.patch, .otp]) | {elixir: "1.\(.minor).\(.patch)", otp: "\(.otp)"})
              | {include: .}')
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  compatibility:
    name: elixir ${{ matrix.elixir }}, otp ${{ matrix.otp }}
    needs: elixir-versions
    if: fromJSON(needs.elixir-versions.outputs.matrix).include[0] != null
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.elixir-versions.outputs.matrix) }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - run: mix test

  # The tools the git hooks run, so an update of one is checked before it
  # merges.
  hooks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans every commit.
          fetch-depth: 0
      - name: Set up the hook tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.8
          install_args: lefthook gitleaks actionlint
      - run: lefthook validate
      - run: actionlint
      - run: gitleaks git --redact --no-banner

  # The one check the ruleset requires, so its list does not follow the jobs
  # and the matrix: it fails when any job above failed or was cancelled.
  ci:
    if: always()
    needs: [check, reference, dialyzer, elixir-versions, compatibility, hooks]
    runs-on: ubuntu-26.04
    steps:
      - name: Check every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
