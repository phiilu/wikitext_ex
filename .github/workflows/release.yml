name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Keeps a release PR open with the next version and changelog; merging it
  # tags the release and creates it on GitHub.
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Publishes the package and its docs to Hex without a key: hex.pm trusts this
  # workflow file in the `hex` environment, and hands it a token for this
  # package only.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    environment: hex
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: mise.toml
          version-type: strict
      - run: mix deps.get
      - run: mix hex.publish --yes
